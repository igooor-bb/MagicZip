name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          cache: true
      - name: Cache compiled Wift scripts
        uses: actions/cache@v6
        with:
          path: .cache/wift
          key: wift-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.mise.toml') }}-${{ hashFiles('Scripts/**/*.swift') }}
          restore-keys: |
            wift-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.mise.toml') }}-
      - run: mise run check
      - run: mise run validate-apple
      - run: mise run setup
      - run: mise run validate-pods
      - run: mise run validate-compatibility
      - run: mise run validate-memory
