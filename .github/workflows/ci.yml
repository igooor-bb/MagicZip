name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - run: mise run check
      - run: mise run validate-apple
      - run: mise run setup
      - run: mise run validate-pods
      - run: mise run validate-compatibility
      - run: mise run validate-memory
