[tools]
swiftformat = "0.62.1"
swiftlint = "0.65.1"
"pipx:clang-format" = "22.1.8"
python = "3.14.7"
uv = "0.12.11"
ruby = "3.4.10"
"conda:jemalloc" = "5.3.0"
"github:igooor-bb/wift" = "0.1.0"
"github:rvben/rumdl" = "0.2.73"

[env]
BUNDLE_PATH = "{{config_root}}/.bundle/gems"
BUNDLE_FROZEN = "true"
WIFT_CACHE_DIR = "{{config_root}}/.cache/wift"

[tasks.format]
description = "Format Swift sources, Swift examples in Markdown and C sources"
run = ["swiftformat .", "./Scripts/format-c.swift"]

[tasks."format-check"]
description = "Check Swift sources, Swift examples in Markdown and C formatting"
run = ["swiftformat --lint .", "./Scripts/format-c.swift --check"]

[tasks.lint]
description = "Lint owned Swift sources"
run = "swiftlint --strict"

[tasks."lint-markdown"]
description = "Lint Markdown documentation"
run = "rumdl check ."

[tasks."format-markdown"]
description = "Format Markdown layout"
run = "rumdl fmt ."

[tasks.test]
description = "Run Swift Testing suite"
run = "swift test"

[tasks.benchmark]
description = "Run Release benchmarks or manage local baselines (arguments forwarded to Benchmark)"
run = "./Scripts/benchmark.swift"

[tasks.check]
description = "Run the same checks locally and in CI"
depends = ["format-check", "lint", "lint-markdown", "test", "validate-examples"]

[tasks.setup]
description = "Install locked fixture and CocoaPods dependencies"
run = ["uv sync --locked --group fixtures", "gem install bundler --version 2.7.1 --no-document", "bundle _2.7.1_ install"]

[tasks."fixtures-python"]
description = "Regenerate independent Python fixtures with locked dependencies"
run = "uv run --locked --group fixtures python Scripts/generate-fixtures.py"

[tasks."validate-examples"]
description = "Build and run all examples against the local package"
run = """
swift build --package-path Examples
swift run --skip-build --package-path Examples CreateAndExtract
swift run --skip-build --package-path Examples PasswordProtectedArchive
swift run --skip-build --package-path Examples SecureArchive
"""

[tasks."validate-apple"]
description = "Build Apple platforms and DocC"
run = "./Scripts/validate-apple.swift"

[tasks."validate-pods"]
description = "Build real CocoaPods clients and validate podspecs"
run = "./Scripts/validate-pods.swift"

[tasks."validate-compatibility"]
description = "Verify independent ZIP compatibility and C symbol isolation"
run = "./Scripts/validate-compatibility.swift"

[tasks."test-memory"]
description = "Check the RSS budget and selective extraction on a 512 MiB archive"
run = "swift run -c release --package-path Tests/StreamingMemoryTests"

[tasks."test-trees"]
description = "Isolated deep/wide traversal and self-input regressions with 128 FDs"
run = "./Scripts/test-trees.swift"

[tasks."update-minizip"]
description = "Import a reviewed minizip-ng tag or commit"
run = "./Scripts/update-minizip.swift"
